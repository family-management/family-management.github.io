<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings — FamilyHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--white:#ffffff;--off:#f7f6f4;--bg:#f0eeeb;--ink:#0c0c0c;--ink2:#3a3a3a;--muted:#888;--border:#e2dfdb;--accent:#1a6bf5;--sidebar-w:220px;}
    body{font-family:'Geist',system-ui,sans-serif;background:var(--off);color:var(--ink);min-height:100%;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 900px 500px at 5% 0%,rgba(26,107,245,.05),transparent 50%);}
    .layout{position:relative;z-index:1;display:flex;min-height:100vh;}
    .sidebar{width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;}
    .sidebar-logo{font-family:'Instrument Serif',serif;font-size:18px;padding:0 20px 24px;text-decoration:none;color:var(--ink);display:block;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;margin:0 8px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;}
    .nav-item:hover,.nav-item.active{background:var(--off);color:var(--ink);font-weight:500;}
    .nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;}
    .sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);}
    .user-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;}
    .btn-out{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted);}
    .main{flex:1;padding:28px 32px;overflow-y:auto;}
    .page-header h1{font-family:'Instrument Serif',serif;font-size:28px;font-weight:400;}
    .page-header p{font-size:14px;color:var(--muted);margin-top:4px;margin-bottom:24px;}
    .panel{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;}
    .panel h2{font-size:15px;font-weight:600;margin-bottom:14px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    .form-grid .full{grid-column:1/-1;}
    label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:5px;}
    input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--off);outline:none;}
    input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,245,.1);background:var(--white);}
    textarea{min-height:80px;resize:vertical;}
    .btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;border:1px solid var(--border);background:var(--white);cursor:pointer;}
    .btn-sm.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
    .btn-sm.danger{color:#c93b2a;border-color:#f0c4c0;}
    .meeting-card{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;background:var(--off);}
    .meeting-card h3{font-size:15px;font-weight:600;margin-bottom:6px;}
    .meeting-meta{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
    .meeting-agenda{font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
    .empty{font-size:13px;color:var(--muted);padding:12px 0;}
    .admin-only{display:none;}
    .auth-loading{position:fixed;inset:0;background:var(--off);display:flex;align-items:center;justify-content:center;z-index:100;font-size:14px;color:var(--muted);}
    .auth-loading.hidden{display:none;}
    @media(max-width:768px){.sidebar{display:none;}.main{padding:20px 16px;}.form-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div id="authLoading" class="auth-loading">Checking session…</div>
  <div class="layout" id="app" style="display:none;">
    <aside class="sidebar">
      <a href="dash.html" class="sidebar-logo">FamilyHub</a>
      <nav>
        <a href="dash.html" class="nav-item">Dashboard</a>
        <a href="meeting.html" class="nav-item active">Meetings</a>
        <a href="acc.html" class="nav-item">Account</a>
        <a href="admin.html" class="nav-item" id="adminNav" style="display:none;">Admin</a>
        <a href="logs.html" class="nav-item" id="logsNav" style="display:none;">Logs</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-row"><div class="avatar" id="userAvatar">?</div><div><div id="userName" style="font-size:13px;font-weight:500;">—</div><div id="userRole" style="font-size:11px;color:var(--muted);">—</div></div></div>
        <button class="btn-out" id="logoutBtn">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div class="page-header">
        <h1>Family meetings</h1>
        <p>Schedule and view family meetings. Only the admin can create or remove them.</p>
      </div>

      <div class="panel admin-only" id="createPanel">
        <h2>Schedule a meeting</h2>
        <div class="form-grid">
          <div class="full">
            <label for="mTitle">Title</label>
            <input id="mTitle" placeholder="e.g. Weekly family check-in" maxlength="120">
          </div>
          <div>
            <label for="mDate">Date</label>
            <input type="date" id="mDate">
          </div>
          <div>
            <label for="mTime">Time</label>
            <input type="time" id="mTime">
          </div>
          <div class="full">
            <label for="mLocation">Location / link</label>
            <input id="mLocation" placeholder="Home / Zoom link / etc." maxlength="200">
          </div>
          <div class="full">
            <label for="mAgenda">Agenda / notes</label>
            <textarea id="mAgenda" placeholder="Topics to discuss…"></textarea>
          </div>
        </div>
        <button class="btn-sm primary" id="addMeeting">Schedule meeting</button>
      </div>

      <div class="panel">
        <h2>Upcoming & past meetings</h2>
        <div id="meetingsList"><p class="empty">Loading…</p></div>
      </div>
    </main>
  </div>
<script>
const SUPABASE_URL = 'https://bwzfzeazmnppgndysqky.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3emZ6ZWF6bW5wcGduZHlzcWt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0ODUxNDcsImV4cCI6MjEwNjA2MTE0N30.OYjsU24HCcAmj_GKpqCWNsGgekwDJsCm3MKLuGlbiLo';
const ADMIN_EMAIL = 'rajeevnitj@gmail.com';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, isAdmin = false;

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
async function logAct(action, type, id, details){
  try{ await sb.from('activity_logs').insert({ user_id: currentUser?.id, email: currentUser?.email, action, entity_type: type, entity_id: id?String(id):null, details }); }catch(_){}
}

(async()=>{
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  currentUser = session.user;
  isAdmin = (currentUser.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  let name = currentUser.email?.split('@')[0] || 'Member';
  try{
    const { data: prof } = await sb.from('profiles').select('full_name,designation,role').eq('id', currentUser.id).single();
    if(prof){ name = prof.full_name || name; document.getElementById('userRole').textContent = prof.designation || prof.role || 'Member'; }
  }catch(_){}
  document.getElementById('userName').textContent = name;
  document.getElementById('userAvatar').textContent = (name[0]||'?').toUpperCase();
  if(isAdmin){
    document.getElementById('adminNav').style.display = 'flex';
    document.getElementById('logsNav').style.display = 'flex';
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
  }
  document.getElementById('authLoading').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  await loadMeetings();
  setInterval(loadMeetings, 15000);
})();

document.getElementById('logoutBtn').onclick = async()=>{ await sb.auth.signOut(); location.href='login.html'; };

async function loadMeetings(){
  const { data, error } = await sb.from('meetings').select('*').order('meeting_date', { ascending: false }).order('meeting_time', { ascending: false });
  const box = document.getElementById('meetingsList');
  if(error){ box.innerHTML = `<p class="empty">Error: ${esc(error.message)}. Make sure the meetings table exists (see SQL below).</p>`; return; }
  if(!data || !data.length){ box.innerHTML = '<p class="empty">No meetings scheduled yet.</p>'; return; }
  const today = new Date().toISOString().slice(0,10);
  box.innerHTML = data.map(m => {
    const past = m.meeting_date < today;
    return `<div class="meeting-card" style="${past?'opacity:.7':''}">
      <h3>${esc(m.title)}${past?' <span style="font-size:11px;color:var(--muted);font-weight:400;">(past)</span>':''}</h3>
      <div class="meeting-meta">
        <strong>${esc(m.meeting_date)}</strong>${m.meeting_time ? ' · ' + esc(m.meeting_time) : ''}
        ${m.location ? '<br>' + esc(m.location) : ''}
      </div>
      ${m.agenda ? `<div class="meeting-agenda">${esc(m.agenda)}</div>` : ''}
      ${isAdmin ? `<div style="margin-top:12px;"><button class="btn-sm danger" onclick="deleteMeeting('${m.id}')">Remove</button></div>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('addMeeting').onclick = async()=>{
  if(!isAdmin){ alert('Only the family admin can schedule meetings.'); return; }
  const title = document.getElementById('mTitle').value.trim();
  const date = document.getElementById('mDate').value;
  if(!title || !date){ alert('Title and date are required.'); return; }
  const { data, error } = await sb.from('meetings').insert({
    title,
    meeting_date: date,
    meeting_time: document.getElementById('mTime').value || null,
    location: document.getElementById('mLocation').value.trim() || null,
    agenda: document.getElementById('mAgenda').value.trim() || null,
    created_by: currentUser.id
  }).select().single();
  if(error){ alert(error.message); return; }
  await logAct('created_meeting', 'meeting', data.id, `Scheduled meeting "${title}" on ${date}`);
  document.getElementById('mTitle').value = '';
  document.getElementById('mDate').value = '';
  document.getElementById('mTime').value = '';
  document.getElementById('mLocation').value = '';
  document.getElementById('mAgenda').value = '';
  await loadMeetings();
};

window.deleteMeeting = async(id)=>{
  if(!isAdmin){ alert('Only the family admin can remove meetings.'); return; }
  if(!confirm('Remove this meeting?')) return;
  await sb.from('meetings').delete().eq('id', id);
  await logAct('deleted_meeting', 'meeting', id, 'Deleted a meeting');
  await loadMeetings();
};
</script>
</body>
</html>
