<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — FamilyHub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #e8eaed;
      --accent: #1a73e8;
      --accent-hover: #1765cc;
      --error: #d93025;
      --shadow-soft: 0 1px 2px rgba(60,64,67,0.08), 0 1px 3px 1px rgba(60,64,67,0.06);
      --shadow-card: 0 1px 3px rgba(60,64,67,0.08), 0 4px 8px 3px rgba(60,64,67,0.04);
      --shadow-elevated: 0 2px 6px rgba(60,64,67,0.1), 0 8px 24px 4px rgba(60,64,67,0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --font: 'Google Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 15%, rgba(255,255,255,0.95) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 85% 85%, rgba(232,234,237,0.5) 0%, transparent 50%);
      opacity: 0.9;
    }
    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--surface);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      font-size: 1.25rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-elevated);
      border: 1px solid rgba(232,234,237,0.9);
      width: 100%;
      max-width: 400px;
      padding: 36px 32px 32px;
    }
    .card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      text-align: center;
    }
    .card .subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
      background: var(--surface);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(26,115,232,0.3);
      margin-top: 8px;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 2px 6px rgba(26,115,232,0.35);
    }
    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .error-msg {
      background: #fce8e6;
      color: var(--error);
      font-size: 0.875rem;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      display: none;
    }
    .error-msg.show { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }
    .note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="page">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏠</span>
      FamilyHub
    </a>

    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Access your family’s private space</p>

      <div id="error" class="error-msg" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@family.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
      </form>

      <p class="note">No public registration. Family members are added by the admin through Supabase.</p>
    </div>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>

  <script>
    // ─── REPLACE THESE WITH YOUR SUPABASE PROJECT VALUES ───
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    // ───────────────────────────────────────────────────────

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Redirect if already logged in
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dash.html';
      }
    })();

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          errorEl.textContent = error.message || 'Invalid email or password.';
          errorEl.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          return;
        }

        window.location.href = 'dash.html';
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
