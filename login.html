<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Family</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --bg: #0a0a0a;
            --text: #f1f1f1;
            --accent: #00d4ff;
            --fog: rgba(0, 212, 255, 0.06);
            --fog-border: rgba(0, 212, 255, 0.25);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: radial-gradient(circle at 15% 30%, var(--fog) 0%, transparent 45%),
                        radial-gradient(circle at 85% 70%, var(--fog) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }
        body::after {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(255,255,255,0.02) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }
        .side-fog {
            position: fixed; top:0; bottom:0; width:2px;
            background: linear-gradient(transparent, var(--fog-border), transparent);
            z-index: 2;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0,212,255,0.15);
        }
        .left-fog { left:0; }
        .right-fog { right:0; }
        
        .login-container {
            background: #181818;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .login-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.1rem;
            text-align: center;
            margin-bottom: 2.5rem;
            background: linear-gradient(90deg, var(--accent), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }
        label {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 0.5rem;
            display: block;
        }
        input {
            background: #0f0f0f;
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.15);
        }
        .login-btn {
            background: var(--accent);
            color: #000;
            padding: 1.2rem;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -10px rgba(0, 212, 255, 0.5);
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.95rem;
        }
        .login-link a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="side-fog left-fog"></div>
    <div class="side-fog right-fog"></div>

    <div class="login-container">
        <div class="login-logo">Family</div>
        <form class="login-form" id="login-form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@family.com" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Sign in</button>
        </form>
        <div class="login-link">
            <p>Don't have access? Contact the family admin.</p>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            if (page === 'login') {
                window.location.href = 'login.html';
            } else if (page === 'dash') {
                window.location.href = 'dash.html';
            }
        }
        
        const form = document.getElementById('login-form');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                alert("✅ Logged in successfully!\n\n(Real Supabase auth would happen here)\n\nWelcome to your family dashboard.");
                window.location.href = 'dash.html';
            });
        }
        
        window.onload = function() {
            document.addEventListener('keydown', function(e) {
                if (e.key === "Enter") {
                    const form = document.getElementById('login-form');
                    if (form) form.dispatchEvent(new Event('submit'));
                }
            });
        };
    </script>
</body>
</html>
