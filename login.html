<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — FamilyHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --white:#ffffff;
      --off:#f7f6f4;
      --bg:#f0eeeb;
      --ink:#0c0c0c;
      --ink2:#3a3a3a;
      --muted:#888;
      --border:#e2dfdb;
      --accent:#1a6bf5;
      --error:#c93b2a;
      --radius:12px;
    }
    html,body{height:100%;}
    body{
      font-family:'Geist',system-ui,sans-serif;background:var(--white);color:var(--ink);
      -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 800px 450px at 20% 10%,rgba(26,107,245,.06),transparent 55%),
        radial-gradient(ellipse 600px 350px at 85% 90%,rgba(240,238,235,.7),transparent 50%);
    }
    .page{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
    .logo{font-family:'Instrument Serif',serif;font-size:22px;color:var(--ink);text-decoration:none;margin-bottom:32px;}
    .card{
      background:var(--white);border:1px solid var(--border);border-radius:16px;
      width:100%;max-width:400px;padding:40px 36px 32px;
      box-shadow:0 2px 40px rgba(0,0,0,.06);
      animation:up .5s ease both;
    }
    .card h1{font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:-.5px;margin-bottom:6px;text-align:center;}
    .card .sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;font-weight:300;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px;}
    input[type="email"],input[type="password"]{
      width:100%;padding:11px 14px;font-size:14px;font-family:inherit;
      border:1px solid var(--border);border-radius:8px;background:var(--off);color:var(--ink);
      transition:border-color .15s,box-shadow .15s,background .15s;outline:none;
    }
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,245,.12);background:var(--white);}
    .btn-primary{
      display:flex;align-items:center;justify-content:center;width:100%;
      padding:12px 20px;border-radius:9px;background:var(--ink);color:#fff;
      font-family:inherit;font-size:14px;font-weight:500;border:none;cursor:pointer;
      transition:all .18s;margin-top:8px;
    }
    .btn-primary:hover:not(:disabled){background:#1a1a1a;box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-1px);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
    .error-msg{
      background:#fef2f1;color:var(--error);font-size:13px;padding:10px 14px;
      border-radius:8px;margin-bottom:18px;display:none;border:1px solid #f5c6c2;
    }
    .error-msg.show{display:block;}
    .note{margin-top:20px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
    .back{display:block;text-align:center;margin-top:28px;font-size:13px;color:var(--muted);text-decoration:none;transition:color .15s;}
    .back:hover{color:var(--ink);}
    @keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
  <div class="page">
    <a href="index.html" class="logo">FamilyHub</a>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Access your family’s private space</p>
      <div id="error" class="error-msg" role="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@family.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>
      <p class="note">No public registration. Family members are added by the admin through Supabase.</p>
    </div>
    <a href="index.html" class="back">Back to home</a>
  </div>

  <script>
    // ─── REPLACE WITH YOUR SUPABASE VALUES ───
    const SUPABASE_URL = 'https://bwzfzeazmnppgndysqky.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3emZ6ZWF6bW5wcGduZHlzcWt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0ODUxNDcsImV4cCI6MjEwNjA2MTE0N30.OYjsU24HCcAmj_GKpqCWNsGgekwDJsCm3MKLuGlbiLo';
    // ─────────────────────────────────────────

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'dash.html';
    })();

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          errorEl.textContent = error.message || 'Invalid email or password.';
          errorEl.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          return;
        }
        window.location.href = 'dash.html';
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
