<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — FamilyHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --white:#ffffff;
      --off:#f8f9fa;
      --bg:#f1f3f4;
      --ink:#202124;
      --ink2:#3a3a3a;
      --muted:#5f6368;
      --border:#e8eaed;
      --accent:#1a73e8;
      --radius:12px;
      --sidebar-w:220px;
    }
    html{height:100%;}
    body{font-family:'Geist',system-ui,sans-serif;background:var(--off);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100%;position:relative;}

    /* Multi-color corner fog lights */
    body::before{
      content:'';
      position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 55% 45% at 0% 0%, rgba(66,133,244,0.18) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(234,67,53,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 50% 42% at 0% 100%, rgba(52,168,83,0.14) 0%, transparent 52%),
        radial-gradient(ellipse 55% 45% at 100% 100%, rgba(251,188,5,0.16) 0%, transparent 55%);
    }
    body::after{
      content:'';
      position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(circle 480px at 0% 0%, rgba(66,133,244,0.22) 0%, transparent 70%),
        radial-gradient(circle 420px at 100% 0%, rgba(234,67,53,0.16) 0%, transparent 68%),
        radial-gradient(circle 440px at 0% 100%, rgba(52,168,83,0.18) 0%, transparent 68%),
        radial-gradient(circle 460px at 100% 100%, rgba(251,188,5,0.20) 0%, transparent 70%),
        radial-gradient(circle 300px at 50% 50%, rgba(255,255,255,0.35) 0%, transparent 70%);
      opacity:1;
    }

    
    .layout{position:relative;z-index:1;display:flex;min-height:100vh;}
    .sidebar{
      width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);
      display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;
    }
    .sidebar-logo{
      font-family:'Instrument Serif',serif;font-size:18px;color:var(--ink);
      text-decoration:none;padding:0 20px 24px;display:block;
    }
    .nav-item{
      display:flex;align-items:center;gap:10px;padding:10px 20px;margin:0 8px;border-radius:8px;
      color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:400;
      transition:all .15s;cursor:pointer;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:inherit;
    }
    .nav-item:hover{background:var(--off);color:var(--ink);}
    .nav-item.active{background:var(--off);color:var(--ink);font-weight:500;}
    .nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .sidebar-footer{margin-top:auto;padding:16px 16px 0;border-top:1px solid var(--border);}
    .user-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px;}
    .avatar{
      width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2);flex-shrink:0;
    }
    .user-meta{min-width:0;}
    .user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-role{font-size:11px;color:var(--muted);}
    .btn-out{
      width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
      background:transparent;font-size:12.5px;font-weight:500;color:var(--muted);
      cursor:pointer;font-family:inherit;transition:all .15s;
    }
    .btn-out:hover{background:var(--off);color:var(--ink);}
    .main{flex:1;padding:28px 32px;overflow-y:auto;}
    .page-header{margin-bottom:28px;}
    .page-header h1{font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:-.5px;font-weight:400;}
    .page-header p{font-size:14px;color:var(--muted);margin-top:4px;font-weight:300;}
    .panel{
      background:var(--white);border:1px solid var(--border);border-radius:14px;
      padding:28px;max-width:520px;animation:fadeIn .35s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px;}
    input,select{
      width:100%;padding:11px 14px;font-size:14px;font-family:inherit;
      border:1px solid var(--border);border-radius:8px;background:var(--off);color:var(--ink);
      transition:border-color .15s,box-shadow .15s,background .15s;outline:none;
    }
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,107,245,.12);background:var(--white);}
    .hint{font-size:12px;color:var(--muted);margin-top:5px;}
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;
      padding:11px 24px;border-radius:9px;background:var(--ink);color:#fff;
      font-family:inherit;font-size:14px;font-weight:500;border:none;cursor:pointer;
      transition:all .18s;margin-top:8px;
    }
    .btn-primary:hover{background:#1a1a1a;box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-1px);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .toast{
      position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;
      padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:50;
      opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none;
    }
    .toast.show{opacity:1;transform:translateY(0);}
    .menu-toggle{
      display:none;position:fixed;top:14px;left:14px;z-index:30;width:40px;height:40px;
      border-radius:9px;border:1px solid var(--border);background:var(--white);cursor:pointer;
      align-items:center;justify-content:center;
    }
    .menu-toggle svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;}
    @media(max-width:768px){
      .menu-toggle{display:flex;}
      .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.1);}
      .sidebar.open{transform:translateX(0);}
      .main{padding:70px 18px 28px;}
    }
    .auth-loading{
      position:fixed;inset:0;background:var(--off);display:flex;align-items:center;justify-content:center;
      z-index:100;font-size:14px;color:var(--muted);
    }
    .auth-loading.hidden{display:none;}
  </style>
</head>
<body>
  <div id="authLoading" class="auth-loading">Checking session…</div>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a href="dash.html" class="sidebar-logo">FamilyHub</a>
      <nav>
        <a href="dash.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="dash.html" class="nav-item" onclick="sessionStorage.setItem('fh_view','calendar')">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendar
        </a>
        <a href="dash.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Tasks
        </a>
        <a href="dash.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Notes
        </a>
        <a href="dash.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Members
        </a>
        <a href="acc.html" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Account
        </a>
        <a href="admin.html" class="nav-item" id="adminNav" style="display:none;">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Admin
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-meta">
            <div class="user-name" id="userName">—</div>
            <div class="user-role" id="userRole">—</div>
          </div>
        </div>
        <button class="btn-out" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>Account</h1>
        <p>Update your name, pronouns, role and designation</p>
      </div>

      <div class="panel">
        <form id="profileForm">
          <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required maxlength="80" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="pronouns">Pronouns</label>
            <input type="text" id="pronouns" name="pronouns" maxlength="40" placeholder="e.g. she/her, he/him, they/them">
            <p class="hint">Optional. Shown on your member card.</p>
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="Parent">Parent</option>
              <option value="Guardian">Guardian</option>
              <option value="Child">Child</option>
              <option value="Grandparent">Grandparent</option>
              <option value="Relative">Relative</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="designation">Designation</label>
            <select id="designation" name="designation">
              <option value="Member">Member</option>
              <option value="Admin">Admin</option>
              <option value="Viewer">Viewer</option>
            </select>
            <p class="hint">Admin can manage family settings later.</p>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled>
            <p class="hint">Email is managed in Supabase and cannot be changed here.</p>
          </div>
          <button type="submit" class="btn-primary" id="saveBtn">Save changes</button>
        </form>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">Profile saved</div>

  <script>
    // ─── REPLACE WITH YOUR SUPABASE VALUES ───
    const SUPABASE_URL = 'https://bwzfzeazmnppgndysqky.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3emZ6ZWF6bW5wcGduZHlzcWt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0ODUxNDcsImV4cCI6MjEwNjA2MTE0N30.OYjsU24HCcAmj_GKpqCWNsGgekwDJsCm3MKLuGlbiLo';
    // ─────────────────────────────────────────

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const store = {
      get(key, fallback) {
        try { return JSON.parse(localStorage.getItem('fh_' + key)) ?? fallback; }
        catch { return fallback; }
      },
      set(key, val) { localStorage.setItem('fh_' + key, JSON.stringify(val)); }
    };

    const ADMIN_EMAIL = 'rajeevnitj@gmail.com';
    const authLoading = document.getElementById('authLoading');

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const user = session.user;
      const profile = store.get('profile', {});
      const name = profile.fullName || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Member';
      const role = profile.role || 'Parent';
      const designation = profile.designation || 'Member';
      const pronouns = profile.pronouns || '';

      document.getElementById('userName').textContent = name;
      document.getElementById('userRole').textContent = designation;
      document.getElementById('userAvatar').textContent = (name[0] || '?').toUpperCase();

      document.getElementById('fullName').value = name;
      document.getElementById('pronouns').value = pronouns;
      document.getElementById('role').value = role;
      document.getElementById('designation').value = designation;
      document.getElementById('email').value = user.email || '';

      // Show Admin link only for the family admin
      if ((user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        const adminNav = document.getElementById('adminNav');
        if (adminNav) adminNav.style.display = 'flex';
      }

      authLoading.classList.add('hidden');
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const fullName = document.getElementById('fullName').value.trim();
      const pronouns = document.getElementById('pronouns').value.trim();
      const role = document.getElementById('role').value;
      const designation = document.getElementById('designation').value;

      const profile = { fullName, pronouns, role, designation };
      store.set('profile', profile);

      // Also update the members list entry for the current user (demo)
      let members = store.get('members', []);
      if (members.length) {
        // Update first member as current user for demo; in real app match by user_id
        members[0] = { ...members[0], name: fullName, role, pronouns, designation };
        store.set('members', members);
      }

      // Optional: try to update user_metadata in Supabase
      try {
        await supabaseClient.auth.updateUser({
          data: { full_name: fullName, pronouns, role, designation }
        });
      } catch (_) {}

      document.getElementById('userName').textContent = fullName;
      document.getElementById('userRole').textContent = designation;
      document.getElementById('userAvatar').textContent = (fullName[0] || '?').toUpperCase();

      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);

      btn.disabled = false;
      btn.textContent = 'Save changes';
    });
  </script>
</body>
</html>
