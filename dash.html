<!-- dash.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard • Family</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --bg: #0a0a0a;
            --text: #f1f1f1;
            --accent: #00d4ff;
            --fog: rgba(0, 212, 255, 0.06);
            --fog-border: rgba(0, 212, 255, 0.25);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: radial-gradient(circle at 15% 30%, var(--fog) 0%, transparent 45%),
                        radial-gradient(circle at 85% 70%, var(--fog) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }
        body::after {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(255,255,255,0.02) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
        }
        .side-fog {
            position: fixed; top:0; bottom:0; width:2px;
            background: linear-gradient(transparent, var(--fog-border), transparent);
            z-index: 2;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0,212,255,0.15);
        }
        .left-fog { left:0; }
        .right-fog { right:0; }
        
        .dash-header {
            padding: 1.75rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter:blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .dash-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        .dash-content {
            padding: 4rem 5% 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .dash-welcome {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3.5rem;
        }
        .welcome-text h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
        }
        .welcome-text p {
            color: #aaa;
            font-size: 1.15rem;
        }
        
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }
        
        .dash-card {
            background: #181818;
            border-radius: 24px;
            padding: 2.25rem;
            border: 1px solid rgba(255,255,255,0.07);
        }
        
        .dash-card h3 {
            margin-bottom: 1.25rem;
            font-size: 1.35rem;
            color: var(--accent);
        }
        
        .dash-card p {
            color: #ccc;
            margin-bottom: 1.5rem;
        }
        
        .dash-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }
        
        .tab-btn {
            padding: 0.85rem 1.75rem;
            background: transparent;
            border: none;
            color: #999;
            font-weight: 500;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 15px -4px rgba(0, 212, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="side-fog left-fog"></div>
    <div class="side-fog right-fog"></div>

    <div class="dash-header">
        <div class="dash-logo">Family</div>
        <div style="display:flex;gap:1rem;align-items:center;">
            <span style="color:#666;font-size:0.95rem;">Welcome back, Alex</span>
            <button onclick="logout()" style="background:transparent;border:none;color:#666;cursor:pointer;font-size:1rem;">Sign out</button>
        </div>
    </div>
    
    <div class="dash-content">
        <div class="dash-welcome">
            <div>
                <h1>Good morning, Alex</h1>
                <p>Here’s what’s happening with your family this week</p>
            </div>
            <div style="text-align:right;">
                <div style="background:#222;padding:1rem 1.5rem;border-radius:16px;display:inline-block;">
                    <strong>3</strong> family members online right now
                </div>
            </div>
        </div>
        
        <div class="dash-tabs">
            <button class="tab-btn active" onclick="switchTab(0)">Overview</button>
            <button class="tab-btn" onclick="switchTab(1)">Tasks</button>
            <button class="tab-btn" onclick="switchTab(2)">Calendar</button>
            <button class="tab-btn" onclick="switchTab(3)">Notes</button>
        </div>
        
        <div id="dash-content" class="dash-grid">
            <div class="dash-card">
                <h3>Family Updates</h3>
                <p>Everything is synced and ready.</p>
                <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;">
                    <div style="background:#222;padding:1rem;border-radius:12px;flex:1;min-width:140px;text-align:center;">
                        <div style="font-size:2.2rem;font-weight:600;color:var(--accent);">12</div>
                        <div style="font-size:0.9rem;color:#666;">Chores done</div>
                    </div>
                    <div style="background:#222;padding:1rem;border-radius:12px;flex:1;min-width:140px;text-align:center;">
                        <div style="font-size:2.2rem;font-weight:600;">3</div>
                        <div style="font-size:0.9rem;color:#666;">Events this week</div>
                    </div>
                </div>
            </div>
            
            <div class="dash-card">
                <h3>Quick Links</h3>
                <p>Common family pages</p>
                <div style="margin-top:2rem;display:flex;flex-direction:column;gap:1rem;">
                    <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                        <span>Shared Calendar</span>
                        <span style="color:var(--accent);">→</span>
                    </a>
                    <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                        <span>Chore Board</span>
                        <span style="color:var(--accent);">→</span>
                    </a>
                    <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                        <span>Family Notes</span>
                        <span style="color:var(--accent);">→</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            if (page === 'login') {
                window.location.href = 'login.html';
            } else if (page === 'dash') {
                window.location.href = 'dash.html';
            }
        }
        
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const contentDiv = document.getElementById('dash-content');
            
            tabs.forEach((t, i) => {
                if (i === tab) t.classList.add('active');
                else t.classList.remove('active');
            });
            
            if (tab === 0) {
                contentDiv.innerHTML = `
                    <div class="dash-grid">
                        <div class="dash-card">
                            <h3>Family Updates</h3>
                            <p>Everything is synced and ready.</p>
                            <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;">
                                <div style="background:#222;padding:1rem;border-radius:12px;flex:1;min-width:140px;text-align:center;">
                                    <div style="font-size:2.2rem;font-weight:600;color:var(--accent);">12</div>
                                    <div style="font-size:0.9rem;color:#666;">Chores done</div>
                                </div>
                                <div style="background:#222;padding:1rem;border-radius:12px;flex:1;min-width:140px;text-align:center;">
                                    <div style="font-size:2.2rem;font-weight:600;">3</div>
                                    <div style="font-size:0.9rem;color:#666;">Events this week</div>
                                </div>
                            </div>
                        </div>
                        <div class="dash-card">
                            <h3>Quick Links</h3>
                            <p>Common family pages</p>
                            <div style="margin-top:2rem;display:flex;flex-direction:column;gap:1rem;">
                                <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                                    <span>Shared Calendar</span>
                                    <span style="color:var(--accent);">→</span>
                                </a>
                                <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                                    <span>Chore Board</span>
                                    <span style="color:var(--accent);">→</span>
                                </a>
                                <a href="#" style="padding:1rem;background:#222;border-radius:12px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center;">
                                    <span>Family Notes</span>
                                    <span style="color:var(--accent);">→</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 1) {
                contentDiv.innerHTML = `
                    <div class="dash-card" style="padding:2.5rem;text-align:center;">
                        <h3 style="margin-bottom:2rem;">Your Tasks</h3>
                        <div style="display:flex;flex-direction:column;gap:1rem;">
                            <div style="background:#222;padding:1.5rem;border-radius:16px;display:flex;justify-content:space-between;">
                                <div><strong>Load the dishwasher</strong> — 2h left</div>
                                <span style="color:#ff6b6b;">Due</span>
                            </div>
                            <div style="background:#222;padding:1.5rem;border-radius:16px;display:flex;justify-content:space-between;">
                                <div><strong>Pick up kids from school</strong> — Done ✅</div>
                            </div>
                            <div style="background:#222;padding:1.5rem;border-radius:16px;display:flex;justify-content:space-between;">
                                <div><strong>Buy groceries</strong> — In progress</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 2) {
                contentDiv.innerHTML = `
                    <div class="dash-card">
                        <h3>Upcoming Events</h3>
                        <p style="color:#aaa;margin:1.5rem 0 2rem;">Next 7 days</p>
                        <div style="display:flex;flex-direction:column;gap:1.25rem;">
                            <div style="display:flex;justify-content:space-between;padding-bottom:1.25rem;border-bottom:1px solid rgba(255,255,255,0.1);">
                                <div>
                                    <div style="font-weight:600;">Family Movie Night</div>
                                    <div style="color:#666;font-size:0.95rem;">Saturday • 7:00 PM</div>
                                </div>
                                <div style="text-align:right;">
                                    <div style="color:var(--accent);">Family</div>
                                </div>
                            </div>
                            <div style="display:flex;justify-content:space-between;padding-bottom:1.25rem;border-bottom:1px solid rgba(255,255,255,0.1);">
                                <div>
                                    <div style="font-weight:600;">School Pickup</div>
                                    <div style="color:#666;font-size:0.95rem;">Tomorrow • 4:30 PM</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 3) {
                contentDiv.innerHTML = `
                    <div class="dash-card">
                        <h3>Family Notes</h3>
                        <p style="margin:2rem 0;">Private notes for the whole family</p>
                        <div style="background:#0f0f0f;padding:2rem;border-radius:16px;min-height:280px;display:flex;align-items:center;justify-content:center;color:#555;font-style:italic;">
                            Double-click to edit this note area (demo)
                        </div>
                    </div>
                `;
            }
        }
        
        function logout() {
            if (confirm("Sign out?")) {
                window.location.href = 'index.html';
            }
        }
        
        window.onload = function() {
            document.addEventListener('keydown', function(e) {
                if (e.key === "Enter") {
                    const form = document.getElementById('login-form');
                    if (form) form.dispatchEvent(new Event('submit'));
                }
            });
        };
    </script>
</body>
</html>
